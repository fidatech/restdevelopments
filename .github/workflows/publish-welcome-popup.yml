name: Publish welcome popup
on:
  push:
    branches: [import/main-site]
    paths: [.github/workflows/publish-welcome-popup.yml]
permissions:
  contents: read
concurrency: restdevelopments-welcome-popup
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cda408843670993674f720b9c5bd342aa700bc47
          persist-credentials: false
      - name: Verify server and replace the welcome layout
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT || secrets.DEPLOY_HOST_FINGERPRINT }}
          HOST: awt-c8-us.afgnoc.com
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY" && test -n "$FINGERPRINT"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key"
          unset KEY
          ssh-keyscan -T 10 -p 22 -t ed25519 "$HOST" > "$RUNNER_TEMP/deploy_known_hosts"
          test "$(ssh-keygen -E sha256 -lf "$RUNNER_TEMP/deploy_known_hosts" | awk '{print $2}')" = "$FINGERPRINT"
          git show HEAD:resources/views/layouts/base.blade.php > "$RUNNER_TEMP/welcome-layout"
          echo "Checkout blob $(git hash-object --no-filters "$RUNNER_TEMP/welcome-layout")"
          ssh -p 22 -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/deploy_known_hosts" "restdevelopments@$HOST" '
              set -eu
              umask 077
              target=/home/restdevelopments/public_html/resources/views/layouts/base.blade.php
              current=$(git hash-object -- "$target")
              if [ "$current" = "15b013f98fccf231e031ee86c7e49a31c979f3c5" ]; then
                echo "Welcome layout is already deployed"
                exit 0
              fi
              if [ "$current" != "597c55ccbe21644428b811ce50470fd9ef37fd9d" ]; then
                echo "Live layout differs from the imported baseline. No files replaced."
                exit 1
              fi
              backup=$(mktemp -d "$HOME/restdevelopments-popup-backup.XXXXXXXX")
              cp -p -- "$target" "$backup/base.blade.php"
              incoming=$(mktemp "$(dirname "$target")/.welcome-layout.XXXXXXXX")
              cat > "$incoming"
              test "$(git hash-object --no-filters "$incoming")" = "15b013f98fccf231e031ee86c7e49a31c979f3c5"
              chmod --reference="$target" "$incoming"
              test "$(git hash-object -- "$target")" = "$current"
              compiled=/home/restdevelopments/public_html/storage/framework/views/4758479ee14bef3bc79d3a5818eef33c.php
              if [ -f "$compiled" ]; then mv -- "$compiled" "$backup/"; fi
              mv -T -- "$incoming" "$target"
              echo "Welcome layout deployed. Original saved at $backup/base.blade.php"
            ' < "$RUNNER_TEMP/welcome-layout"
