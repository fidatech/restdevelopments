name: Inspect server layout (read only)
on:
  push:
    branches: [redesign/rest-signature]
    paths: [.github/workflows/inspect-server.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: awt-c8-us.afgnoc.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Look at the folders, rewrite rules and app address
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT || secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/k"
          ssh-keyscan -T 10 -t ed25519 "$HOST" > "$RUNNER_TEMP/kh"
          test "$(ssh-keygen -E sha256 -lf "$RUNNER_TEMP/kh" | awk '{print $2}')" = "$FINGERPRINT"
          scp -i "$RUNNER_TEMP/k" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" scripts/inspect-projects.php "restdevelopments@$HOST:inspect-projects.php"
          ssh -i "$RUNNER_TEMP/k" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/kh" "restdevelopments@$HOST" bash -s <<'SH'
          cd /home/restdevelopments/public_html
          php "$HOME/inspect-projects.php"
          rm -f "$HOME/inspect-projects.php"
          SH
