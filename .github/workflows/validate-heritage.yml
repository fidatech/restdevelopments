name: Validate heritage redesign on server
on:
  push:
    branches: [redesign/heritage-lightweight]
    paths: [.github/workflows/validate-heritage.yml, scripts/validate-heritage.php]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Stage templates outside public_html and render routes
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT || secrets.DEPLOY_HOST_FINGERPRINT }}
          HOST: awt-c8-us.afgnoc.com
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY" && test -n "$FINGERPRINT"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key"
          unset KEY
          ssh-keyscan -T 10 -p 22 -t ed25519 "$HOST" > "$RUNNER_TEMP/known_hosts"
          test "$(ssh-keygen -E sha256 -lf "$RUNNER_TEMP/known_hosts" | awk '{print $2}')" = "$FINGERPRINT"
          ssh_opts=(-p 22 -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts")
          server="restdevelopments@$HOST"
          stage=$(ssh "${ssh_opts[@]}" "$server" 'mktemp -d "$HOME/restdevelopments-heritage-stage.XXXXXXXX"')
          tar -cf - resources/views app/Http/Controllers/HomeController.php public/assets/css/heritage.css public/assets/js/heritage.js public/assets/img/rest-logo-small.webp scripts/validate-heritage.php | ssh "${ssh_opts[@]}" "$server" "tar -xf - -C '$stage'"
          echo "Staged source at $stage"
          ssh "${ssh_opts[@]}" "$server" "php '$stage/scripts/validate-heritage.php' '$stage/resources/views' /en/ && php '$stage/scripts/validate-heritage.php' '$stage/resources/views' /en/about && php '$stage/scripts/validate-heritage.php' '$stage/resources/views' /en/projects && php '$stage/scripts/validate-heritage.php' '$stage/resources/views' /en/latest-launches && php '$stage/scripts/validate-heritage.php' '$stage/resources/views' /en/contact && php '$stage/scripts/validate-heritage.php' '$stage/resources/views' /en/team && php '$stage/scripts/validate-heritage.php' '$stage/resources/views' /en/blog && php '$stage/scripts/validate-heritage.php' '$stage/resources/views' /en/careers"
