name: Inspect homepage slide assets
on:
  push:
    branches: [redesign/heritage-lightweight]
    paths: [.github/workflows/inspect-slides.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read published slide counts and image dimensions
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT || secrets.DEPLOY_HOST_FINGERPRINT }}
          HOST: awt-c8-us.afgnoc.com
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY" && test -n "$FINGERPRINT"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key"
          unset KEY
          ssh-keyscan -T 10 -p 22 -t ed25519 "$HOST" > "$RUNNER_TEMP/known_hosts"
          test "$(ssh-keygen -E sha256 -lf "$RUNNER_TEMP/known_hosts" | awk '{print $2}')" = "$FINGERPRINT"
          ssh -p 22 -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" "restdevelopments@$HOST" 'bash -se' <<'REMOTE'
          cd /home/restdevelopments/public_html
          php <<'PHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app=require __DIR__.'/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          $slides=App\Models\Slider::where('status','published')->ordered()->take(6)->get();
          echo "published slides: ".$slides->count()."\n";
          foreach($slides as $slide) {
            echo "slide ".$slide->id."\n";
            foreach(['image','image_mobile'] as $field) {
              $relative=$slide->$field;
              $file=$relative ? __DIR__.'/public/storage/'.$relative : '';
              $size=$file && is_file($file) ? filesize($file) : 0;
              $dimensions=$file && is_file($file) ? getimagesize($file) : null;
              echo $field.": ".($relative ?: 'none')." bytes=".$size." dimensions=".($dimensions ? $dimensions[0].'x'.$dimensions[1] : 'unknown')."\n";
            }
          }
          PHP
          REMOTE
