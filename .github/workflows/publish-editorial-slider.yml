name: Publish editorial slider
on:
  push:
    branches: [redesign/heritage-lightweight]
    paths: [.github/workflows/publish-editorial-slider.yml]
permissions:
  contents: read
concurrency: restdevelopments-public-theme
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d410e990f6ed37a004c5e33dbadbd68e2bad3be8
          fetch-depth: 0
          persist-credentials: false
      - name: Check slider JavaScript
        run: node --check public/assets/js/heritage.js
      - name: Optimize images, back up source, and publish slider
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT || secrets.DEPLOY_HOST_FINGERPRINT }}
          HOST: awt-c8-us.afgnoc.com
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY" && test -n "$FINGERPRINT"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key"
          unset KEY
          ssh-keyscan -T 10 -p 22 -t ed25519 "$HOST" > "$RUNNER_TEMP/known_hosts"
          test "$(ssh-keygen -E sha256 -lf "$RUNNER_TEMP/known_hosts" | awk '{print $2}')" = "$FINGERPRINT"
          ssh_opts=(-p 22 -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts")
          server="restdevelopments@$HOST"
          files=(
            app/Http/Controllers/HomeController.php
            resources/views/home/index.blade.php
            public/assets/css/heritage.css
            public/assets/js/heritage.js
          )
          : > heritage-manifest.tsv
          for path in "${files[@]}"; do
            if expected=$(git rev-parse --verify "19f1f8e5d3ab685fa635a233d8ac33d14bf41c40:$path" 2>/dev/null); then
              printf '%s\t%s\n' "$expected" "$path" >> heritage-manifest.tsv
            else
              printf 'NEW\t%s\n' "$path" >> heritage-manifest.tsv
            fi
          done
          stage=$(ssh "${ssh_opts[@]}" "$server" 'mktemp -d "$HOME/restdevelopments-heritage-release.XXXXXXXX"')
          tar -cf - "${files[@]}" scripts/build-hero-images.php scripts/deploy-heritage.sh heritage-manifest.tsv | ssh "${ssh_opts[@]}" "$server" "tar -xf - -C '$stage'"
          ssh "${ssh_opts[@]}" "$server" "php -l '$stage/scripts/build-hero-images.php' && php '$stage/scripts/build-hero-images.php' /home/restdevelopments/public_html && bash '$stage/scripts/deploy-heritage.sh' '$stage' && cd /home/restdevelopments/public_html && for locale in en ps fa uz; do php artisan cache:forget site.sliders.\$locale >/dev/null; done && curl -fsSL --max-time 25 https://restdevelopments.com/ | grep -q 'data-hero-to=\"3\"'"
