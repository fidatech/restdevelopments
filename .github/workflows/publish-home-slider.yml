name: Publish homepage slider
on:
  push:
    branches: [import/main-site]
    paths: [.github/workflows/publish-home-slider.yml]
permissions:
  contents: read
concurrency: restdevelopments-home-slider
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: aef5d7a212cfef79413571f1236be769928e9bd9
          persist-credentials: false
      - name: Verify server and replace the welcome layout
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT || secrets.DEPLOY_HOST_FINGERPRINT }}
          HOST: awt-c8-us.afgnoc.com
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY" && test -n "$FINGERPRINT"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key"
          unset KEY
          ssh-keyscan -T 10 -p 22 -t ed25519 "$HOST" > "$RUNNER_TEMP/deploy_known_hosts"
          test "$(ssh-keygen -E sha256 -lf "$RUNNER_TEMP/deploy_known_hosts" | awk '{print $2}')" = "$FINGERPRINT"
          git show HEAD:resources/views/home/sections/slider.blade.php > "$RUNNER_TEMP/slider-view"
          echo "Checkout blob $(git hash-object --no-filters "$RUNNER_TEMP/slider-view")"
          ssh -p 22 -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/deploy_known_hosts" "restdevelopments@$HOST" '
              set -eu
              umask 077
              target=/home/restdevelopments/public_html/resources/views/home/sections/slider.blade.php
              current=$(git hash-object -- "$target")
              if [ "$current" = "485791a8969cb135735a8ae214a30d98644ba52d" ]; then
                echo "Homepage slider is already deployed"
                exit 0
              fi
              if [ "$current" != "1397c2e9c369a828432fc12f5f954c2b5365d56f" ]; then
                echo "Live layout differs from the imported baseline. No files replaced."
                exit 1
              fi
              backup=$(mktemp -d "$HOME/restdevelopments-slider-backup.XXXXXXXX")
              cp -p -- "$target" "$backup/slider.blade.php"
              incoming=$(mktemp "$(dirname "$target")/.slider-view.XXXXXXXX")
              cat > "$incoming"
              test "$(git hash-object --no-filters "$incoming")" = "485791a8969cb135735a8ae214a30d98644ba52d"
              chmod --reference="$target" "$incoming"
              test "$(git hash-object -- "$target")" = "$current"
              mv -T -- "$incoming" "$target"
              echo "Homepage slider deployed. Previous view saved at $backup/slider.blade.php"
            ' < "$RUNNER_TEMP/slider-view"
