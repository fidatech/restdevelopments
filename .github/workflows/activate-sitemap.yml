name: Activate generated sitemap
on:
  push:
    branches: [redesign/heritage-lightweight]
    paths: [.github/workflows/activate-sitemap.yml]
permissions:
  contents: read
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate current sitemap and preserve previous file
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT || secrets.DEPLOY_HOST_FINGERPRINT }}
          HOST: awt-c8-us.afgnoc.com
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEY" && test -n "$FINGERPRINT"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/deploy_key"
          unset KEY
          ssh-keyscan -T 10 -p 22 -t ed25519 "$HOST" > "$RUNNER_TEMP/known_hosts"
          test "$(ssh-keygen -E sha256 -lf "$RUNNER_TEMP/known_hosts" | awk '{print $2}')" = "$FINGERPRINT"
          ssh -p 22 -i "$RUNNER_TEMP/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" "restdevelopments@$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          root=/home/restdevelopments/public_html
          cd "$root"
          old="$root/public/sitemap.xml"
          test -f "$old" && test ! -L "$old"
          generated=$(mktemp "$root/public/.sitemap-generated.XXXXXXXX")
          trap 'rm -f -- "$generated"' EXIT
          php <<'PHP' > "$generated"
          <?php
          require __DIR__ . '/vendor/autoload.php';
          $app = require __DIR__ . '/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
          echo $app->make(App\Http\Controllers\SitemapController::class)()->getContent();
          PHP
          grep -q '<urlset' "$generated"
          grep -q '/en/projects' "$generated"
          backup=$(mktemp -d "$HOME/restdevelopments-sitemap-backup.XXXXXXXX")
          cp -p -- "$old" "$backup/sitemap.xml"
          chmod 644 "$generated"
          mv -- "$generated" "$old"
          if ! curl -fsSL --max-time 25 https://restdevelopments.com/sitemap.xml | grep -q '/en/projects'; then
            cp -p -- "$backup/sitemap.xml" "$old"
            echo "Sitemap check failed; previous version restored."
            exit 1
          fi
          echo "Generated sitemap active. Previous version saved at $backup/sitemap.xml"
          REMOTE
