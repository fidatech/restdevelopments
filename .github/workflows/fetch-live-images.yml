name: Fetch live project images for design samples
on:
  push:
    branches: [redesign/rest-signature]
    paths: [.github/workflows/fetch-live-images.yml]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download, resize and print images
        run: |
          set -euo pipefail
          mkdir img && cd img
          for p in /en/ /en/projects /en/projects?page=2 /en/blog /en/about; do curl -sL "https://restdevelopments.com$p"; done > all.html
          grep -oE 'https://restdevelopments.com/(storage|assets/img/slider)/[^"'"'"' )]+\.(jpe?g|png|webp)' all.html | sort -u > urls.txt
          cat urls.txt
          i=0
          while read -r u; do
            i=$((i+1)); f=$(printf 'img%02d' $i)
            curl -sfL "$u" -o "$f.src" || continue
            convert "$f.src" -resize '1400x1400>' -quality 72 "$f.jpg" || continue
            echo "MAP $f $u $(identify -format '%wx%h' $f.jpg)"
            base64 -w 8000 "$f.jpg" | sed "s/^/IMG $f /"
          done < urls.txt
